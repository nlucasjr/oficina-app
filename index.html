<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina — Gestão</title>
<meta name="theme-color" content="#201e1f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oficina">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><img class="brand-logo" src="logo.png" alt="Mecânica Rodrigues"><span id="brandName" class="sr-only">Oficina</span></div>
    <nav id="nav" aria-label="Menu principal">
      <a href="#painel" data-r="painel"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5h4v5"/></svg><span class="lbl">Painel</span></a>
      <a href="#orcamentos" data-r="orcamentos"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h8l4 4v14h-12z"/><path d="M14.5 3v4h4"/><path d="M9.5 12h6M9.5 16h6"/></svg><span class="lbl">Orçamentos</span></a>
      <a href="#clientes" data-r="clientes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.6-3.8 3.7-5.8 7.5-5.8s6.9 2 7.5 5.8"/></svg><span class="lbl">Clientes</span></a>
      <a href="#veiculos" data-r="veiculos"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 16.5v-4l2.2-5.2c.3-.7.9-1.1 1.6-1.1h9.4c.7 0 1.3.4 1.6 1.1l2.2 5.2v4z"/><path d="M3.5 12.5h17"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/></svg><span class="lbl">Veículos</span></a>
      <a href="#pecas" data-r="pecas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7v10l-8 4-8-4V7z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg><span class="lbl"><span class="l-long">Peças e materiais</span><span class="l-short">Peças</span></span></a>
      <a href="#config" data-r="config"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg><span class="lbl"><span class="l-long">Configurações</span><span class="l-short">Ajustes</span></span></a>
    </nav>
    <div class="side-foot">
      <div id="syncStatus" class="sync"></div>
      <div id="userBox" hidden><span id="userEmail"></span> <button id="logoutBtn" class="linkbtn">Sair</button></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <div class="brand dark"><img class="brand-logo" src="logo-branco.png" alt="Mecânica Rodrigues"></div>
    <h2>Entrar</h2>
    <label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" required>
    <label style="margin-top:12px">Senha</label><input id="loginPass" type="password" autocomplete="current-password" required>
    <div id="loginErr" class="login-err"></div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:8px">Entrar</button>
  </form>
</div>
<div id="modal" class="modal"></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="cloud.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
