# Roda os testes a cada push e só publica o site no GitHub Pages se todos passarem.
# Em pull requests roda só os testes (não publica).
# Requer: Settings → Pages → Source = "GitHub Actions".
name: Testes e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: teste
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Instalar dependências dos testes
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils postgresql-client fonts-liberation

      - name: Rodar os testes
        run: python tests/rodar.py

      - name: Guardar prints dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prints-dos-testes
          path: tests/saida/
          retention-days: 7

  publicar:
    name: Publicar no GitHub Pages
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Separar só os arquivos do app
        run: |
          mkdir _site
          rsync -a --exclude='.git*' --exclude='.github' --exclude='tests' --exclude='docs' --exclude='README.md' --exclude='_site' ./ _site/
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
