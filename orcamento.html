<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#201e1f">
<title>Orçamento — Mecânica Rodrigues</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  .pub-top { background: var(--side); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; justify-content: center; }
  .pub-top img { height: 56px; width: auto; display: block; border-radius: 8px; }
  .pub { max-width: 680px; margin: 0 auto; padding: 16px 14px calc(32px + env(safe-area-inset-bottom, 0px)); }
  .pub h1 { font-size: 22px; }
  .pub-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .pub-meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .pub-of { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .pub-of b { color: var(--text); }
  .pub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pub-lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
  .pub-sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .it { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .it:last-child { border-bottom: 0; }
  .it .d { min-width: 0; overflow-wrap: anywhere; }
  .it .q { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .it .v { font-weight: 600; white-space: nowrap; }
  .tot div { display: flex; justify-content: space-between; padding: 4px 0; }
  .tot .grand { font-size: 21px; font-weight: 700; border-top: 2px solid var(--text); margin-top: 6px; padding-top: 10px; }
  .pub-txt p { margin: 0 0 8px; overflow-wrap: anywhere; }
  .pub-txt p:last-child { margin-bottom: 0; }
  .pub-resp h2 { margin-bottom: 6px; }
  .pub-btns { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 14px; }
  .pub-btns .btn, .pub-contato .btn { justify-content: center; min-height: 50px; font-size: 16px; }
  .btn.aprovar { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.recusar { color: var(--bad); }
  .btn:disabled { opacity: .55; cursor: default; }
  .pub-err { color: var(--bad); font-size: 14px; margin: 10px 0 0; }
  .pub-err:empty { display: none; }
  .pub-status { border-left: 5px solid var(--border); }
  .pub-status h2 { margin-bottom: 4px; }
  .st-aprovado { border-left-color: var(--ok); background: #ebfbee; }
  .st-recusado { border-left-color: var(--bad); background: #fff5f5; }
  .st-vencido { border-left-color: var(--warn); background: #fff4e6; }
  .st-concluido { border-left-color: var(--info); background: #e7f5ff; }
  .pub-contato .btn { width: 100%; }
  .badge.b-vencido { background: #f1f3f5; color: var(--muted); }
  .pub-foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 18px; line-height: 1.5; }
  .pub-msg { text-align: center; padding: 34px 20px; }
  .pub-msg h2 { font-size: 19px; }
  @media (max-width: 520px) { .pub-grid { grid-template-columns: 1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header class="pub-top"><img src="logo.png" alt="Mecânica Rodrigues"></header>
<div class="pub" id="pub"><div class="card pub-msg"><p class="muted">Carregando orçamento...</p></div></div>
<script src="config.js"></script>
<script>
/* Página pública do orçamento: o cliente abre pelo link do WhatsApp (sem login),
   vê o orçamento e pode aprovar ou recusar. Fala com o Supabase só pelas funções
   orcamento_publico e responder_orcamento (ver supabase.sql). */
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? 0 : n; };
  const brl = (v) => num(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const fmtDate = (d) => (d ? String(d).slice(0, 10).split("-").reverse().join("/") : "");
  const fmtDataHora = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  };
  const pad = (n) => String(n ?? "").padStart(4, "0");
  const waNumber = (tel) => {
    let d = String(tel || "").replace(/\D/g, "");
    if (d.startsWith("0")) d = d.replace(/^0+/, "");
    if (d.length === 10 || d.length === 11) d = "55" + d;
    return d;
  };
  const STATUS = { aberto: "Aguardando resposta", aprovado: "Aprovado", recusado: "Recusado", concluido: "Concluído" };

  const token = new URLSearchParams(location.search).get("t") || "";
  const CFG = window.OFICINA_CONFIG || {};
  let sb = null, orc = null, enviando = false;

  function mensagem(titulo, texto) {
    $("#pub").innerHTML = `<div class="card pub-msg"><h2>${esc(titulo)}</h2><p class="muted">${esc(texto)}</p></div>`;
  }

  async function carregar() {
    if (!token) return mensagem("Link incompleto", "Confira se você abriu o link inteiro enviado pela oficina.");
    if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase)
      return mensagem("Não foi possível abrir o orçamento", "Verifique sua conexão com a internet e tente de novo.");
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    });
    try {
      const { data, error } = await sb.rpc("orcamento_publico", { p_token: token });
      if (error) throw error;
      if (!data) return mensagem("Orçamento não encontrado",
        "O link pode estar incompleto ou o orçamento foi removido. Fale com a oficina.");
      orc = data;
      render();
    } catch (e) {
      console.error(e);
      mensagem("Não foi possível abrir o orçamento", "Verifique sua conexão com a internet e tente de novo em instantes.");
    }
  }

  function totais(o) {
    let pecas = 0, servicos = 0;
    for (const it of o.itens || []) {
      const sub = num(it.qtd) * num(it.valor);
      if (it.tipo === "servico") servicos += sub; else pecas += sub;
    }
    const bruto = pecas + servicos, desconto = Math.min(num(o.desconto), bruto);
    return { pecas, servicos, desconto, total: bruto - desconto };
  }

  function itensHTML(lista, titulo) {
    if (!lista.length) return "";
    return `<div class="card"><h2>${titulo}</h2>${lista.map((it) => {
      const q = num(it.qtd), un = it.tipo !== "servico" ? " " + (it.unidade || "un") : "";
      const det = q === 1 && it.tipo === "servico" ? "" :
        `<div class="q">${q.toLocaleString("pt-BR")}${esc(un)} × ${brl(it.valor)}</div>`;
      return `<div class="it"><div class="d">${esc(it.descricao) || "Item"}${det}</div>
        <div class="v">${brl(q * num(it.valor))}</div></div>`;
    }).join("")}</div>`;
  }

  const estaVencido = (o) =>
    (o.status || "aberto") === "aberto" && !!o.validade && !!o.hoje && String(o.validade) < String(o.hoje);

  function respostaHTML(o) {
    const st = o.status || "aberto";
    const vencido = estaVencido(o);
    const r = o.resposta || {};
    const quem = r.nome ? ` por ${esc(r.nome)}` : "";
    const quando = r.em ? ` em ${fmtDataHora(r.em)}` : "";
    if (vencido)
      return `<div class="card pub-status st-vencido"><h2>Orçamento vencido</h2>
        <p class="muted" style="margin:0">Este orçamento valia até ${fmtDate(o.validade)}. Fale com a oficina para atualizar os valores.</p></div>`;
    if (st === "aprovado")
      return `<div class="card pub-status st-aprovado"><h2>✓ Orçamento aprovado</h2>
        <p style="margin:0">${r.acao ? `Aprovado pelo link${quem}${quando}.` : "Este orçamento já foi aprovado."} A oficina vai combinar com você o início do serviço.</p></div>`;
    if (st === "recusado")
      return `<div class="card pub-status st-recusado"><h2>Orçamento recusado</h2>
        <p style="margin:0">${r.acao ? `Recusado pelo link${quem}${quando}.` : "Este orçamento foi recusado."} Se mudar de ideia, fale com a oficina.</p></div>`;
    if (st === "concluido")
      return `<div class="card pub-status st-concluido"><h2>Serviço concluído</h2>
        <p style="margin:0">Obrigado pela preferência!</p></div>`;
    return `<div class="card pub-resp" id="resp"><h2>Sua resposta</h2>
      <p class="muted" style="margin:0 0 12px">Confira os itens e valores acima e responda abaixo. A oficina recebe sua resposta no sistema.</p>
      <label for="nome">Seu nome (opcional)</label>
      <input id="nome" maxlength="80" autocomplete="name" placeholder="Quem está respondendo">
      <div class="pub-btns">
        <button class="btn aprovar" data-r="1">✓ Aprovar orçamento</button>
        <button class="btn recusar" data-r="0">Recusar</button>
      </div>
      <p class="pub-err" id="respErr"></p></div>`;
  }

  function render() {
    const o = orc, of = o.oficina || {}, v = o.veiculo || {}, c = o.cliente || {};
    const t = totais(o);
    const itens = o.itens || [];
    const veic = [v.marca, v.modelo, v.ano].filter(Boolean).join(" ");
    const contatoOf = [of.telefone && `WhatsApp ${esc(of.telefone)}`, of.email && esc(of.email)].filter(Boolean).join(" · ");
    const tel = waNumber(of.telefone);
    const extras = [
      o.prazo && `<p><b>Prazo de execução:</b> ${esc(o.prazo)}</p>`,
      o.pagamento && `<p><b>Forma de pagamento:</b> ${esc(o.pagamento)}</p>`,
      o.obs && `<p><b>Observações:</b> ${esc(o.obs)}</p>`,
    ].filter(Boolean).join("");
    document.title = `Orçamento nº ${pad(o.numero)} — ${of.nome || "Oficina"}`;

    $("#pub").innerHTML = `
      <div class="card">
        <div class="pub-head"><div><h1>Orçamento nº ${pad(o.numero)}</h1>
          <div class="pub-meta">Emitido em ${fmtDate(o.data)}${o.validade ? ` · válido até ${fmtDate(o.validade)}` : ""}</div></div>
          ${estaVencido(o)
            ? `<span class="badge b-vencido">Vencido</span>`
            : `<span class="badge b-${esc(o.status || "aberto")}">${STATUS[o.status] || STATUS.aberto}</span>`}</div>
        <div class="pub-of"><b>${esc(of.nome || "Oficina")}</b>${of.cnpj ? ` · CNPJ ${esc(of.cnpj)}` : ""}
          ${contatoOf ? `<br>${contatoOf}` : ""}${of.endereco ? `<br>${esc(of.endereco)}` : ""}</div>
      </div>

      <div class="card pub-grid">
        <div><div class="pub-lbl">Cliente</div><b>${esc(c.nome) || "—"}</b></div>
        <div><div class="pub-lbl">Veículo</div>${v.placa ? `<span class="plate">${esc(v.placa)}</span> ` : ""}<b>${esc(veic) || "—"}</b>
          ${[v.cor && "Cor: " + esc(v.cor), o.km && "Km: " + num(o.km).toLocaleString("pt-BR")].filter(Boolean).length
            ? `<div class="pub-sub">${[v.cor && "Cor: " + esc(v.cor), o.km && "Km: " + num(o.km).toLocaleString("pt-BR")].filter(Boolean).join(" · ")}</div>` : ""}</div>
      </div>

      ${o.problema ? `<div class="card pub-txt"><h2>Problema relatado / diagnóstico</h2><p>${esc(o.problema)}</p></div>` : ""}
      ${itensHTML(itens.filter((i) => i.tipo !== "servico"), "Peças e materiais")}
      ${itensHTML(itens.filter((i) => i.tipo === "servico"), "Serviços / mão de obra")}

      <div class="card tot">
        ${t.pecas ? `<div><span>Peças e materiais</span><span>${brl(t.pecas)}</span></div>` : ""}
        ${t.servicos ? `<div><span>Serviços</span><span>${brl(t.servicos)}</span></div>` : ""}
        ${t.desconto ? `<div><span>Desconto</span><span>− ${brl(t.desconto)}</span></div>` : ""}
        <div class="grand"><span>Total</span><span>${brl(t.total)}</span></div>
      </div>

      ${extras ? `<div class="card pub-txt">${extras}</div>` : ""}
      ${respostaHTML(o)}
      ${tel ? `<div class="pub-contato"><a class="btn" target="_blank" rel="noopener"
          href="https://wa.me/${tel}?text=${encodeURIComponent(`Olá! Sobre o orçamento nº ${pad(o.numero)}:`)}">Falar com a oficina no WhatsApp</a></div>` : ""}
      <div class="pub-foot">${of.rodape ? esc(of.rodape) + "<br>" : ""}Orçamento gerado pelo sistema da ${esc(of.nome || "oficina")}.</div>`;
  }

  async function responder(aprovar) {
    if (enviando) return;
    const pergunta = aprovar
      ? `Confirmar a APROVAÇÃO do orçamento nº ${pad(orc.numero)}?`
      : `Confirmar a RECUSA do orçamento nº ${pad(orc.numero)}?`;
    if (!confirm(pergunta)) return;
    enviando = true;
    document.querySelectorAll(".pub-btns .btn").forEach((b) => (b.disabled = true));
    $("#respErr").textContent = "";
    try {
      const { data, error } = await sb.rpc("responder_orcamento", {
        p_token: token, p_aprovar: aprovar, p_nome: ($("#nome")?.value || "").trim() || null,
      });
      if (error || !data) throw error || new Error("sem resposta");
      if (data.erro === "nao_encontrado")
        return mensagem("Orçamento não encontrado", "O orçamento foi removido. Fale com a oficina.");
      if (data.orcamento) orc = data.orcamento;
      render();
      $(".pub-status")?.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (e) {
      console.error(e);
      document.querySelectorAll(".pub-btns .btn").forEach((b) => (b.disabled = false));
      const err = $("#respErr");
      if (err) err.textContent = "Não foi possível enviar sua resposta. Verifique a internet e tente de novo.";
    } finally {
      enviando = false;
    }
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest(".pub-btns [data-r]");
    if (b) responder(b.dataset.r === "1");
  });

  carregar();
})();
</script>
</body>
</html>
